name: Deploy Pages

on:
  push:
    branches:
      - main
    tags:
      - "release-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy stable site from main
        if: github.ref_type == 'branch'
        env:
          GH_PAGES_REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: npm run deploy:stable

      - name: Deploy archived release from tag
        if: github.ref_type == 'tag'
        env:
          GH_PAGES_REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: npm run deploy:release -- "${GITHUB_REF_NAME}"
